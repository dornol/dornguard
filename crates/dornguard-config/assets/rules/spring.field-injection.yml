id: spring.field-injection
engine: semgrep
severity: error
description: Spring field injection hides a class's dependencies.
fix: >-
  Take the dependency as a constructor parameter and store it in a private
  final field, then remove @Autowired from the field. With Lombok, add
  @RequiredArgsConstructor to the class and make the field private final.
  Lombok does not copy @Qualifier from a field to the generated constructor
  unless lombok.config lists it under lombok.copyableAnnotations. A circular
  dependency needs a design change instead: extract the shared logic into a
  third bean.
implementation:
  config: rules/semgrep/spring/field-injection.yml
  rule_id: spring-field-injection
guidance:
  reports: >-
    A Java field annotated with @Autowired, @Inject or @Resource, with or
    without arguments, static or not.
  not_reported: >-
    Setter and constructor injection.
  bad: |-
    @Autowired
    private OrderRepository orders;
  good: |-
    private final OrderRepository orders;

    OrderService(OrderRepository orders) {
        this.orders = orders;
    }
  suppress: >-
    In a test class that the Spring test framework injects; test sources are
    skipped by default.
