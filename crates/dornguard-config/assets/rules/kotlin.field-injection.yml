id: kotlin.field-injection
engine: semgrep
severity: error
description: Spring field injection hides a class's dependencies.
fix: >-
  Take the dependency as a primary constructor parameter, declared as private val, and remove the annotated lateinit var. A circular dependency needs a design change instead: extract the shared logic into a third bean.
implementation:
  config: rules/semgrep/kotlin/field-injection.yml
  rule_id: kotlin-field-injection
guidance:
  reports: >-
    A Kotlin lateinit var or var property annotated with @Autowired, @Inject
    or @Resource.
  not_reported: >-
    Constructor injection, including `@Autowired constructor`.
  bad: |-
    class Catalog {
        @Autowired
        lateinit var books: BookRepository
    }
  good: |-
    class Catalog(private val books: BookRepository)
  suppress: >-
    In a test class that Spring's test framework injects; test sources are
    skipped by default.
