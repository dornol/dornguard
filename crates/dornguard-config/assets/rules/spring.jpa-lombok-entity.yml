id: spring.jpa-lombok-entity
engine: semgrep
severity: warning
description: Lombok generates equals, hashCode or toString for this JPA entity from all of its fields, which loads lazy associations, can recurse through bidirectional relations and changes the hash code when the entity is saved.
fix: >-
  Remove @Data, @EqualsAndHashCode and @ToString from the entity. Use @Getter
  and @Setter, base equality on the identifier with
  @EqualsAndHashCode(onlyExplicitlyIncluded = true), and list the fields
  toString prints.
implementation:
  config: rules/semgrep/spring/jpa-lombok-entity.yml
  rule_id: spring-jpa-lombok-entity
guidance:
  reports: >-
    A JPA @Entity class with Lombok @Data, or @EqualsAndHashCode or
    @ToString without arguments.
  not_reported: >-
    Those annotations with arguments such as onlyExplicitlyIncluded = true,
    and Lombok on classes that are not entities.
  bad: |-
    @Data
    @Entity
    class Order { ... }
  good: |-
    @Entity
    @Getter
    @Setter
    @EqualsAndHashCode(onlyExplicitlyIncluded = true)
    class Order {
        @Id
        @EqualsAndHashCode.Include
        private Long id;
    }
  suppress: >-
    For an entity with no associations and an assigned natural identifier;
    say so in the reason.
