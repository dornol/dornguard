id: kotlin.run-blocking-in-suspend
engine: semgrep
severity: warning
description: runBlocking blocks the thread inside a suspend function.
fix: Call the suspending operation directly or use coroutineScope for structured concurrency.
implementation:
  config: rules/semgrep/kotlin/run-blocking-in-suspend.yml
  rule_id: kotlin-run-blocking-in-suspend
guidance:
  reports: >-
    kotlinx.coroutines.runBlocking inside a suspend function.
  bad: |-
    suspend fun load() = runBlocking { fetch() }
  good: |-
    suspend fun load() = fetch()
  suppress: >-
    Do not suppress; it blocks the coroutine's thread.
