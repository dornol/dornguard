id: html.inline-script
engine: semgrep
severity: warning
description: This HTML script contains inline JavaScript.
fix: Move the JavaScript to a file and load it with src.
all_html: true
implementation:
  config: rules/semgrep/html/inline-script.yml
  rule_id: html-inline-script
guidance:
  reports: >-
    An executable inline <script> block in HTML and templates.
  not_reported: >-
    Scripts loaded through src or th:src, and data blocks such as
    application/ld+json.
  bad: |-
    <script>
      initPage();
    </script>
  good: |-
    <script src="/js/page.js"></script>
  suppress: >-
    Only for a script that carries a CSP nonce or hash the server sets, and
    say which in the reason.
