id: spring.static-member-injection
engine: semgrep
severity: error
description: Spring does not inject a static field or static method, so the value stays unset.
fix: >-
  Make the field or setter an instance member of the bean, or bind the value
  with @ConfigurationProperties and pass the bean where it is needed.
implementation:
  config: rules/semgrep/spring/static-member-injection.yml
  rule_id: spring-static-member-injection
guidance:
  reports: >-
    Spring's @Value on a static field or static method, or @Autowired on a
    static method.
  not_reported: >-
    @Autowired fields, static or not, which spring.field-injection reports.
  bad: |-
    @Value("${app.name}")
    private static String name;
  good: |-
    private final String name;

    AppSettings(@Value("${app.name}") String name) {
        this.name = name;
    }
  suppress: >-
    Do not suppress; Spring never sets the value.
