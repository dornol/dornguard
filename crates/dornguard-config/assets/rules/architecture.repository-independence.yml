id: architecture.repository-independence
engine: archunit
severity: error
description: Repositories must remain independent of service and controller layers.
fix: Move orchestration into a service.
options:
  from: [repository]
  forbidden: [controller, service]
guidance:
  reports: >-
    A class in a `repository` package that depends on a class in a `service`
    or `controller` package (layered profile).
  bad: |-
    package example.repository;

    final class AdminRepository {
        Class<?> upward = example.service.AdminService.class;
    }
  good: |-
    package example.repository;

    final class AdminRepository {} // the service calls the repository, not the other way
  suppress: >-
    Only for a dependency the team has accepted as a documented exception,
    such as generated code; otherwise move the code so the dependency goes
    the allowed way.
  options: >-
    rules.<id>.options.from and rules.<id>.options.forbidden take package
    name segments, which replace the defaults listed under Reports.
