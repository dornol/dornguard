id: architecture.library-framework-independence
engine: archunit
severity: error
description: A Java library must not reference the Spring framework.
fix: Keep the framework integration in the consuming application.
options:
  forbidden: [org.springframework]
guidance:
  reports: >-
    Any class of a module with the java-library profile that references an
    `org.springframework` type.
  bad: |-
    package example.common;

    @org.springframework.stereotype.Component
    public class Managed {}
  good: |-
    package example.common;

    public class Managed {} // the application module declares the bean
  suppress: >-
    Only for a dependency the team has accepted as a documented exception,
    such as generated code; otherwise move the code so the dependency goes
    the allowed way.
  options: >-
    rules.<id>.options.from and rules.<id>.options.forbidden take package
    name segments, which replace the defaults listed under Reports.
