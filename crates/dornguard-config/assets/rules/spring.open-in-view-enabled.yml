id: spring.open-in-view-enabled
engine: builtin
severity: warning
confidence: medium
description: This Spring Boot application uses Spring Data JPA and leaves spring.jpa.open-in-view at its default of true, so every web request holds a database connection until the response is written and lazy loading can run queries from the view.
fix: >-
  Set spring.jpa.open-in-view=false in application.properties or
  application.yml, and load what each response needs in the service with fetch
  joins, entity graphs or DTO queries.
guidance:
  reports: >-
    A @SpringBootApplication class in a module whose build file, or a parent
    build file, names spring-boot-starter-data-jpa, and whose
    src/main/resources/application.properties, application.yml or
    application.yaml does not set spring.jpa.open-in-view to false outside a
    profile-specific document. With --changed it runs only when the
    application class changes.
  bad: |-
    # application.yml
    spring:
      jpa:
        show-sql: false
  good: |-
    # application.yml
    spring:
      jpa:
        open-in-view: false
  suppress: >-
    When the property is set elsewhere, such as environment variables or a
    config server; say where in the reason.
