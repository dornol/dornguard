id: architecture.application-independence
engine: archunit
severity: error
description: Application code must not depend on adapters or infrastructure.
fix: Depend on a port implemented by the adapter.
options:
  from: [application]
  forbidden: [adapter, infrastructure]
guidance:
  reports: >-
    A class in an `application` package that depends on a class in an
    `adapter` or `infrastructure` package (hexagonal profile).
  bad: |-
    package example.application;

    class Orchestrator {
        Object adapter = new example.adapter.BookAdapter();
    }
  good: |-
    package example.application;

    class Orchestrator {
        private final BookStore store; // a port interface in application, implemented by the adapter
    }
  suppress: >-
    Only for a dependency the team has accepted as a documented exception,
    such as generated code; otherwise move the code so the dependency goes
    the allowed way.
  options: >-
    rules.<id>.options.from and rules.<id>.options.forbidden take package
    name segments, which replace the defaults listed under Reports.
