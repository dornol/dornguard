id: flyway.changed-versioned-migration
engine: builtin
severity: warning
description: An existing Flyway versioned migration changed or was removed.
fix: Preserve the existing migration and introduce a new versioned migration for the change.
guidance:
  reports: >-
    A modification, deletion or rename of an existing versioned Flyway
    migration such as `db/migration/V3__add_index.sql`, compared with --base
    or HEAD.
  not_reported: >-
    Newly added versions and repeatable `R__` migrations.
  bad: |-
    -- db/migration/V3__add_index.sql, already applied, edited in place
    CREATE INDEX idx_book_title ON book (title, author);
  good: |-
    -- db/migration/V4__extend_book_index.sql, a new version
    DROP INDEX idx_book_title;
    CREATE INDEX idx_book_title ON book (title, author);
  suppress: >-
    Only when the migration has never run in any shared database, for
    example it was added earlier in the same unmerged branch.
