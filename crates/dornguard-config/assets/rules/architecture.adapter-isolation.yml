id: architecture.adapter-isolation
engine: archunit
severity: error
description: An inbound adapter must not depend on an outbound adapter.
fix: Route the dependency through an application port.
options:
  from: [inbound]
  forbidden: [outbound]
guidance:
  reports: >-
    A class in a package with an `inbound` segment that depends on a class
    in a package with an `outbound` segment (hexagonal profile). One
    diagnostic per depending class, with the number of dependencies and up
    to three examples.
  bad: |-
    package example.api.inbound;

    class BookController {
        private final example.api.outbound.BookJpaAdapter adapter;
    }
  good: |-
    package example.api.inbound;

    class BookController {
        private final example.application.BookCatalog catalog; // an application port
    }
  suppress: >-
    Only for a dependency the team has accepted as a documented exception,
    such as generated code; otherwise move the code so the dependency goes
    the allowed way.
  options: >-
    rules.<id>.options.from and rules.<id>.options.forbidden take package
    name segments, which replace the defaults listed under Reports.
