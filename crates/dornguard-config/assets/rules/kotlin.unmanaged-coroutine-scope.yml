id: kotlin.unmanaged-coroutine-scope
engine: semgrep
severity: warning
confidence: medium
description: A class creates a CoroutineScope and never cancels it, so its coroutines keep running after the class is no longer used.
fix: >-
  Cancel the scope when the owner shuts down, for example in a @PreDestroy or
  close() function, or launch the work in a scope with a lifecycle such as
  coroutineScope { } or a framework-provided scope.
implementation:
  config: rules/semgrep/kotlin/unmanaged-coroutine-scope.yml
  rule_id: kotlin-unmanaged-coroutine-scope
guidance:
  reports: >-
    A val initialized with CoroutineScope(...) in a class with no function
    that calls cancel on it.
  bad: |-
    class Poller {
        private val scope = CoroutineScope(Dispatchers.Default)
    }
  good: |-
    class Poller {
        private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Default)

        @PreDestroy
        fun close() = scope.cancel()
    }
  suppress: >-
    When the class lives as long as the process, such as an application-wide
    singleton; say so in the reason.
