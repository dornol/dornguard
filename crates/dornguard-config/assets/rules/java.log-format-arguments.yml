id: java.log-format-arguments
engine: pmd
severity: warning
description: The number of {} placeholders in a log message does not match its arguments.
fix: Pass one argument for each {} placeholder. Pass an exception as the last argument without a placeholder so the logger records its stack trace.
implementation:
  config: rules/pmd/java/log-format-arguments.xml
  rule_id: InvalidLogMessageFormat
guidance:
  reports: >-
    A log call whose {} placeholders do not match the number of arguments,
    as reported by PMD.
  not_reported: >-
    A trailing exception argument, which needs no placeholder.
  bad: |-
    log.info("user {} signed in from {}", user);
  good: |-
    log.info("user {} signed in from {}", user, address);
  suppress: >-
    Do not suppress; fix the message or the arguments.
