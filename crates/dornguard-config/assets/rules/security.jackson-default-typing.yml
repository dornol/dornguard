id: security.jackson-default-typing
engine: semgrep
severity: warning
confidence: medium
description: Jackson reads a class name from the input and can instantiate a class the input chooses.
fix: >-
  Use JsonTypeInfo.Id.NAME with @JsonSubTypes to list the allowed subtypes. If
  you need default typing, pass activateDefaultTyping a
  BasicPolymorphicTypeValidator that allows only your own packages or base
  types.
implementation:
  config: rules/semgrep/security/jackson-default-typing.yml
  rule_id: security-jackson-default-typing
guidance:
  reports: >-
    Jackson enableDefaultTyping, activateDefaultTyping with
    LaissezFaireSubTypeValidator, and @JsonTypeInfo(use = Id.CLASS) or
    Id.MINIMAL_CLASS, which let the input choose the class to instantiate.
  not_reported: >-
    activateDefaultTyping with another validator, and Id.NAME.
  bad: |-
    mapper.activateDefaultTyping(LaissezFaireSubTypeValidator.instance);
  good: |-
    mapper.activateDefaultTyping(BasicPolymorphicTypeValidator.builder()
        .allowIfSubType("com.example.events.").build());
  suppress: >-
    When the JSON never comes from outside the system, such as a local cache
    file the application writes; say so in the reason.
