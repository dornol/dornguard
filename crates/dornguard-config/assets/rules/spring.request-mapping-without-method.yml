id: spring.request-mapping-without-method
engine: semgrep
severity: warning
description: This @RequestMapping handler names no HTTP method, so it answers every method, including state-changing requests sent as GET.
fix: >-
  Use @GetMapping, @PostMapping, @PutMapping, @PatchMapping or @DeleteMapping,
  or set method = RequestMethod.X on the @RequestMapping.
implementation:
  config: rules/semgrep/spring/request-mapping-without-method.yml
  rule_id: spring-request-mapping-without-method
guidance:
  reports: >-
    A handler method annotated with @RequestMapping without method, which
    answers every HTTP method.
  not_reported: >-
    Class-level @RequestMapping, which only shares a path prefix.
  bad: |-
    @RequestMapping("/cancel")
    String cancel() { ... }
  good: |-
    @PostMapping("/cancel")
    String cancel() { ... }
  suppress: >-
    When the endpoint must accept every method, such as a webhook receiver;
    say so in the reason.
