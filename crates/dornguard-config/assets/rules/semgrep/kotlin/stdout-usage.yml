rules:
  - id: kotlin-stdout-usage
    languages: [kotlin]
    severity: ERROR
    message: Use the project logger.
    patterns:
      - pattern-either:
          - pattern: println(...)
          - pattern: kotlin.io.println(...)
      # A command-line entry point writes to standard output by design.
      - pattern-not-inside: |
          fun main(...) {
            ...
          }
