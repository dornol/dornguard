rules:
  - id: spring-transactional-self-invocation
    languages: [java]
    severity: WARNING
    message: A direct call to this method bypasses Spring transaction advice in proxy mode.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  class $OWNER {
                    ...
                    @org.springframework.transaction.annotation.Transactional(...)
                    $RETURN $TARGET() { ... }
                    ...
                    $CALLER_RETURN $CALLER(...) { $...BODY }
                    ...
                  }
              - focus-metavariable: $...BODY
          - patterns:
              - pattern-inside: |
                  class $OWNER {
                    ...
                    $CALLER_RETURN $CALLER(...) { $...BODY }
                    ...
                    @org.springframework.transaction.annotation.Transactional(...)
                    $RETURN $TARGET() { ... }
                    ...
                  }
              - focus-metavariable: $...BODY
      - pattern-either:
          - pattern: this.$TARGET()
          - pattern: $TARGET()
      - pattern-not-inside: new $TYPE(...) { ... }
