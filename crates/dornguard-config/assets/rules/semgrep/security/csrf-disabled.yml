rules:
  - id: security-csrf-disabled
    languages: [java]
    message: Keep CSRF protection enabled for browser-based sessions.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $H.csrf().disable()
          - pattern: $H.csrf(AbstractHttpConfigurer::disable)
          - pattern: $H.csrf($C -> $C.disable())
      # A stateless chain authenticates every request, so CSRF tokens add nothing.
      - pattern-not-inside: |
          $RET $NAME(...) {
            ...
            <... SessionCreationPolicy.STATELESS ...>;
            ...
          }
