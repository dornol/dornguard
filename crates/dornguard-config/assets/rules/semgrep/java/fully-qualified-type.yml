rules:
  - id: java-fully-qualified-type
    languages: [java]
    severity: WARNING
    message: Consider importing this type and using its simple name.
    pattern-regex: |-
      (?x)
      (?:
          (?<![\w$]) (?:package|import) \s+ [^;]* ;
        | // [^\r\n]*
        | /\* [\s\S]*? \*/
        | """ (?: \\[\s\S] | (?!""")[\s\S] )* """
        | " (?: \\[^\r\n] | [^"\\\r\n] )* "
        | ' (?: \\[^\r\n] | [^'\\\r\n] )* '
      ) (*SKIP)(*F)
      |
      (?<![\w$.])
      (?! (?:this|super) \s* \. )
      (?:
          (?: [a-z_][a-z0-9_]* \s* \. \s* ){2,} [A-Z][\w$]*
        | [a-z_][a-z0-9_]* \s* \. \s* [A-Z][\w$]*[a-z][\w$]*
      )
      (?: \s* \. \s* [A-Z][\w$]*[a-z][\w$]* )*
      (?![\w$])
