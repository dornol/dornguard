id: jsp.unescaped-output
engine: semgrep
severity: warning
confidence: medium
description: This JSTL output explicitly disables XML escaping.
fix: Keep escaping enabled for text or verify that the HTML is sanitized before rendering.
jsp_only: true
implementation:
  config: rules/semgrep/jsp/unescaped-output.yml
  rule_id: jsp-unescaped-output
guidance:
  reports: >-
    A JSTL <c:out> tag with a literal escapeXml="false".
  bad: |-
    <c:out value="${comment.body}" escapeXml="false"/>
  good: |-
    <c:out value="${comment.body}"/>
  suppress: >-
    When the value is HTML the server produced or sanitized; name the
    sanitizer in the reason.
