id: architecture.framework-independence
engine: archunit
severity: error
description: Domain and application code must not reference the Spring framework.
fix: Apply framework annotations and integrations in an adapter.
options:
  from: [domain, application]
  forbidden: [org.springframework]
guidance:
  reports: >-
    A class in a `domain` or `application` package that references an
    `org.springframework` type, including annotations (hexagonal profile).
  bad: |-
    package example.domain;

    @org.springframework.stereotype.Component
    class PriceCalculator {}
  good: |-
    package example.domain;

    class PriceCalculator {} // registered as a bean in a configuration class outside domain
  suppress: >-
    Only for a dependency the team has accepted as a documented exception,
    such as generated code; otherwise move the code so the dependency goes
    the allowed way.
  options: >-
    rules.<id>.options.from and rules.<id>.options.forbidden take package
    name segments, which replace the defaults listed under Reports.
