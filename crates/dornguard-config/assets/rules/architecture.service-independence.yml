id: architecture.service-independence
engine: archunit
severity: error
description: A service must not depend on the controller layer.
fix: Move web types such as request and response objects to the controller, and pass the service plain values or domain types.
options:
  from: [service]
  forbidden: [controller]
guidance:
  reports: >-
    A class in a `service` package that depends on a class in a `controller`
    package, such as a request or response type declared there (layered
    profile).
  bad: |-
    package example.service;

    class OrderService {
        void place(example.controller.OrderRequest request) {}
    }
  good: |-
    package example.service;

    class OrderService {
        void place(String customerId, int quantity) {} // the controller maps its request type
    }
  suppress: >-
    Only for a dependency the team has accepted as a documented exception,
    such as generated code; otherwise move the code so the dependency goes
    the allowed way.
  options: >-
    rules.<id>.options.from and rules.<id>.options.forbidden take package
    name segments, which replace the defaults listed under Reports.
