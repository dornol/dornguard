id: jsp.scripting-element
engine: semgrep
severity: warning
description: This JSP contains embedded scripting code.
fix: Move logic to Java code and use JSP EL or tag libraries for rendering.
jsp_only: true
implementation:
  config: rules/semgrep/jsp/scripting-element.yml
  rule_id: jsp-scripting-element
guidance:
  reports: >-
    JSP scripting elements: <% ... %>, <%= ... %>, <%! ... %> and their
    <jsp:scriptlet>, <jsp:expression> and <jsp:declaration> forms.
    Directives <%@ ... %> and comments are not reported.
  bad: |-
    <%= request.getParameter("name") %>
  good: |-
    <c:out value="${param.name}"/>
  suppress: >-
    Only in a legacy page scheduled for removal, with the ticket in the
    reason.
