id: kotlin.print-stack-trace
engine: semgrep
severity: error
description: Avoid printing stack traces to standard error.
fix: Log the exception with the project logger and pass it as the last argument.
implementation:
  config: rules/semgrep/kotlin/print-stack-trace.yml
  rule_id: kotlin-print-stack-trace
guidance:
  reports: >-
    A call to printStackTrace() in Kotlin.
  bad: |-
    catch (e: IOException) {
        e.printStackTrace()
    }
  good: |-
    catch (e: IOException) {
        log.error("Could not read {}", path, e)
    }
  suppress: >-
    Only in a command-line tool without a logger; say so in the reason.
