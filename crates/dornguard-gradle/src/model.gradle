import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.tasks.SourceSetContainer

gradle.projectsEvaluated {
    def root = gradle.rootProject
    def requestPath = root.providers.gradleProperty('dornguardModelRequest').get()
    def request = new JsonSlurper().parse(new File(requestPath))
    def compileModules = request.compileModules as Set
    boolean compileAll = request.compileAll
    def javaModules = root.allprojects.findAll {
        it.extensions.findByType(SourceSetContainer)?.findByName('main') != null
    }
    def compileProjects = javaModules.findAll { compileAll || compileModules.contains(it.path) }
    def taskName = 'dornguardExportProjectModel'

    root.tasks.register(taskName) {
        dependsOn(compileProjects.collect { project ->
            def main = project.extensions.getByType(SourceSetContainer).getByName('main')
            project.tasks.named(main.classesTaskName)
        })
        doLast {
            def modules = root.allprojects.collect { project ->
                def main = project.extensions.findByType(SourceSetContainer)?.findByName('main')
                def test = project.extensions.findByType(SourceSetContainer)?.findByName('test')
                def compile = main == null ? null : project.tasks.named(main.compileJavaTaskName).get()
                def compileTest = test == null ? null : project.tasks.named(test.compileJavaTaskName).get()
                def kotlinMain = project.plugins.hasPlugin('org.jetbrains.kotlin.jvm') ?
                    project.extensions.getByName('kotlin').sourceSets.getByName('main') : null
                def compileKotlin = main == null || kotlinMain == null ? null :
                    project.tasks.findByName(main.getCompileTaskName('kotlin'))
                def dependencies = ['api', 'implementation', 'compileOnly', 'compileOnlyApi', 'runtimeOnly'].collectMany { name ->
                    def configuration = project.configurations.findByName(name)
                    configuration == null ? [] : configuration.allDependencies.withType(ProjectDependency).collect { projectPath(it) }
                }.unique().sort()
                [
                    path: project.path,
                    name: project.name,
                    projectDir: project.projectDir.canonicalPath,
                    sourceDirs: main == null ? [] : main.java.srcDirs*.canonicalPath.sort(),
                    testSourceDirs: test == null ? [] : test.java.srcDirs*.canonicalPath.sort(),
                    compileSources: project in compileProjects && hasCompileOutput(compile) ?
                        compile.source.files*.canonicalPath.sort() : [],
                    kotlinCompiled: project in compileProjects && hasCompileOutput(compileKotlin),
                    kotlinSourceDirs: kotlinMain == null ? [] : kotlinMain.kotlin.srcDirs*.canonicalPath.sort(),
                    kotlinCompilerPlugins: [
                        'org.jetbrains.kotlin.plugin.spring',
                        'org.jetbrains.kotlin.plugin.allopen',
                        'org.jetbrains.kotlin.plugin.jpa',
                        'org.jetbrains.kotlin.plugin.noarg',
                    ].findAll { project.plugins.hasPlugin(it) },
                    classDirs: main == null ? [] : main.output.classesDirs.files*.canonicalPath.sort(),
                    classpath: main != null && project in compileProjects ? main.compileClasspath.files*.canonicalPath : [],
                    javaTarget: compile == null ? null : javaVersion(compile, 'target', compile.targetCompatibility),
                    javaSource: compile == null ? null : javaVersion(compile, 'source', compile.sourceCompatibility),
                    javaTestSource: compileTest == null ? null : javaVersion(compileTest, 'source', compileTest.sourceCompatibility),
                    dependencies: dependencies,
                ]
            }.sort { it.path }
            new File(request.output).setText(JsonOutput.toJson([schemaVersion: 1, modules: modules]), 'UTF-8')
        }
    }
}

Integer javaVersion(compile, String option, String compatibility) {
    if (compile.options.release.present) {
        return compile.options.release.get()
    }
    def args = compile.options.compilerArgs
    for (String flag : ['--release', "--${option}".toString(), "-${option}".toString()]) {
        int index = args.indexOf(flag)
        if (index >= 0) {
            return parseJavaVersion(args.getAt(index + 1))
        }
        def assignment = args.find { it.startsWith(flag + '=') }
        if (assignment != null) {
            return parseJavaVersion(assignment.substring(flag.length() + 1))
        }
    }
    return parseJavaVersion(compatibility)
}

// ProjectDependency.getPath() exists from Gradle 8.11; getDependencyProject() is the
// only way to the path before it and is gone in Gradle 9.
String projectPath(ProjectDependency dependency) {
    dependency.metaClass.respondsTo(dependency, 'getPath') ?
        dependency.path : dependency.dependencyProject.path
}

Integer parseJavaVersion(String value) {
    def version = value?.replaceFirst('^1\\.', '')
    return version?.isInteger() ? version.toInteger() : null
}

boolean hasCompileOutput(task) {
    task != null && task.enabled && task.state.executed && !task.state.noSource &&
        (!task.state.skipped || task.state.skipMessage in ['UP-TO-DATE', 'FROM-CACHE'])
}
