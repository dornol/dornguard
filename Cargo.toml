[workspace]
members = ["crates/*"]
default-members = ["crates/dornguard-cli"]
resolver = "3"

[workspace.package]
version = "0.0.7"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
ignore = "0.4"
miette = "7"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "process", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dornguard-config = { version = "0.0.7", path = "crates/dornguard-config" }
dornguard-core = { version = "0.0.7", path = "crates/dornguard-core" }
dornguard-engine = { version = "0.0.7", path = "crates/dornguard-engine" }
dornguard-gradle = { version = "0.0.7", path = "crates/dornguard-gradle" }
dornguard-report = { version = "0.0.7", path = "crates/dornguard-report" }

[workspace.lints.clippy]
unwrap_used = "warn"
