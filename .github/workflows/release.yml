name: DornGuard Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  candidate:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      artifact_ids: ${{ steps.find.outputs.artifact_ids }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate the tag and find verified packages
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version."
            exit 1
          fi

          commit=$(git rev-parse HEAD)
          runs=$(gh run list --workflow release.yml --event workflow_dispatch \
            --branch "$DEFAULT_BRANCH" --commit "$commit" --status success \
            --json databaseId --jq '.[].databaseId')
          for run in $runs; do
            artifacts=$(gh api "repos/$GH_REPO/actions/runs/$run/artifacts?per_page=100" --jq '
              [.artifacts[] | select(.expired == false)
                | select(.name == "dornguard-linux-x86_64" or .name == "dornguard-macos-arm64")]
              | select((map(.name) | sort) == ["dornguard-linux-x86_64", "dornguard-macos-arm64"])
              | map(.id) | join(",")')
            if [[ -n "$artifacts" ]]; then
              echo "Reusing verified packages from run $run."
              {
                echo "run_id=$run"
                echo "artifact_ids=$artifacts"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No verified packages available for $commit. Building from the tag."

  package:
    needs: candidate
    if: ${{ !cancelled() && (needs.candidate.result == 'skipped' || (needs.candidate.result == 'success' && needs.candidate.outputs.run_id == '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: macos-15, platform: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: Cache Maven downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('crates/dornguard-cli/tests/maven.rs', 'crates/dornguard-cli/tests/gradle.rs') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Build matching JVM artifacts
        run: |
          scripts/retry.sh examples/spring-boot-multimodule/gradlew --no-daemon --console=plain -p runners/archunit-runner jar
          python - <<'PY' >> "$GITHUB_ENV"
          import hashlib
          from pathlib import Path

          jars = Path("runners/archunit-runner/build/libs")
          for name, jar in (("ARCHUNIT", "archunit-runner.jar"), ("MAVEN_MODEL", "maven-model.jar")):
              print(f"DORNGUARD_{name}_SHA256={hashlib.sha256((jars / jar).read_bytes()).hexdigest()}")
          PY
      - name: Install the pinned ESLint
        run: |
          mkdir -p .ci-tools/eslint
          cp scripts/ci-eslint/package.json scripts/ci-eslint/package-lock.json .ci-tools/eslint/
          (cd .ci-tools/eslint && ../../scripts/retry.sh npm ci --no-audit --no-fund)
          echo "$GITHUB_WORKSPACE/.ci-tools/eslint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Build CLI
        run: |
          cargo build --release --locked
          target/release/dornguard version
      - name: Verify managed engines
        env:
          DORNGUARD_ENGINE_DIR: ${{ runner.temp }}/dornguard-engines
          DORNGUARD_ARCHUNIT_RUNNER: ${{ github.workspace }}/runners/archunit-runner/build/libs/archunit-runner.jar
        run: |
          scripts/retry.sh target/release/dornguard engines install
          target/release/dornguard doctor
          go version
          cargo test --workspace --locked -- --include-ignored
          target/release/dornguard check examples/spring-boot-multimodule --format json
      - name: Package release
        env:
          PLATFORM: ${{ matrix.platform }}
          DORNGUARD_ENGINE_DIR: ${{ runner.temp }}/dornguard-engines
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            python scripts/package-release.py "$PLATFORM" --tag "$GITHUB_REF_NAME" --smoke-test
          else
            python scripts/package-release.py "$PLATFORM" --smoke-test
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dornguard-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.candidate.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.candidate.outputs.run_id != '')) }}
    runs-on: ubuntu-24.04
    needs: [candidate, package]
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download previously verified packages
        if: needs.candidate.outputs.run_id != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.candidate.outputs.run_id }}
          artifact-ids: ${{ needs.candidate.outputs.artifact_ids }}
          path: dist
          merge-multiple: true
      - name: Download packages built from the tag
        if: needs.candidate.outputs.run_id == ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          for platform in linux-x86_64 macos-arm64; do
            name="dornguard-$GITHUB_REF_NAME-$platform.zip"
            (cd dist && sha256sum -- "$name" | diff - "$name.sha256")
            assets+=("dist/$name" "dist/$name.sha256")
          done
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes
          fi
