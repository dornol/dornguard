name: DornGuard CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DORNGUARD_ARCHUNIT_RUNNER: ${{ github.workspace }}/runners/archunit-runner/build/libs/archunit-runner.jar
      DORNGUARD_ENGINE_DIR: ${{ github.workspace }}/.ci-tools/managed
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned engines and build the runner
        run: scripts/ci-tools.sh
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test real engines
        run: cargo test --locked --workspace -- --include-ignored
      - name: Check the complete example
        run: cargo run --locked -- check examples/spring-boot-multimodule --format sarif > dornguard.sarif
      - name: Check the Kotlin/JVM example
        run: cargo run --locked -- check examples/kotlin-multimodule --format json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dornguard-sarif
          path: dornguard.sarif
          if-no-files-found: ignore
