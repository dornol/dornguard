name: DornGuard CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Cache cargo-deny and cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-about
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-${{ runner.os }}-deny-0.22.0-about-0.9.3-rust-${{ hashFiles('.github/rust-version') }}
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: Install cargo-deny
        run: scripts/retry.sh cargo install cargo-deny --locked --version 0.22.0
      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked check
      - name: Install cargo-about
        run: scripts/retry.sh cargo install cargo-about --locked --version 0.9.3 --features cli
      - name: Check Rust dependency notices are current
        run: scripts/generate-rust-notices.sh --check

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: Lint and test without external engines
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DORNGUARD_ARCHUNIT_RUNNER: ${{ github.workspace }}/runners/archunit-runner/build/libs/archunit-runner.jar
      DORNGUARD_ENGINE_DIR: ${{ github.workspace }}/.ci-tools/managed
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: Cache Maven downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('crates/dornguard-cli/tests/maven.rs', 'crates/dornguard-cli/tests/gradle.rs') }}
          restore-keys: maven-${{ runner.os }}-
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Check install docs name the current release
        run: python scripts/check-version-refs.py
      - name: Validate Gradle and Maven configuration examples
        run: |
          python -m pip install 'jsonschema==4.25.1' 'PyYAML==6.0.3'
          python scripts/check-config-schema.py
      - name: Install pinned engines and build the runner
        run: scripts/ci-tools.sh
      - name: Put the pinned ESLint on PATH
        run: echo "${{ github.workspace }}/.ci-tools/eslint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Format and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test real engines
        run: cargo test --locked --workspace -- --include-ignored
      - name: Check the complete example
        run: cargo run --locked -- check examples/spring-boot-multimodule --format sarif > dornguard.sarif
      - name: Check the Kotlin/JVM example
        run: cargo run --locked -- check examples/kotlin-multimodule --format json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dornguard-sarif
          path: dornguard.sarif
          if-no-files-found: ignore
